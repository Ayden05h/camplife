<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Clubs</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVIGATION BAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Campus Life App</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
                    <li class="nav-item"><a class="nav-link active" href="clubs.html">Clubs</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- PAGE CONTENT -->
    <div class="container mt-4">
        <h1 class="mb-4">Campus Clubs</h1>

        <!-- CLUB SEARCH BAR -->
        <input type="text" class="form-control mb-4" placeholder="Search clubs...">

        <!-- CLUB GRID -->
        <div class="row g-3">

            <!-- CLUB CARD -->
            <div class="col-md-4">
                <div class="card p-3">
                    <div class="placeholder-glow">
                        <div class="placeholder col-12 mb-3" style="height: 120px;"></div>
                    </div>
                    <h5>Club Name</h5>
                    <p>Short description of the club goes here.</p>
                    <button class="btn btn-success joinBtn">Join Club</button>
                </div>
            </div>

        </div>

        <!-- FEATURED CLUB -->
        <h3 class="mt-5">Featured Club</h3>
        <div class="card p-3">
            <div class="row">
                <div class="col-md-4">
                    <div class="placeholder-glow">
                        <div class="placeholder col-12" style="height: 150px;"></div>
                    </div>
                </div>
                <div class="col-md-8">
                    <h4>Featured Club Name</h4>
                    <p>club content</p>
                    <button class="btn btn-primary">Learn More</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Your JavaScript -->
    <script src="js/script.js"></script>

</body>
</html>
