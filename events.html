<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Events</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Your CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVIGATION BAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Campus Life App</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="events.html">Events</a></li>
                    <li class="nav-item"><a class="nav-link" href="clubs.html">Clubs</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- PAGE CONTENT -->
    <div class="container mt-4">
        <h1 class="mb-4">Campus Events</h1>

        <!-- EVENT CALENDAR -->
        <div class="card p-3 mb-4">
            <h4>Event Calendar</h4>
            <p>Calendar UI Placeholder </p>
            <div class="placeholder-glow">
                <div class="placeholder col-12" style="height: 200px;"></div>
            </div>
        </div>

        <!-- FILTERS -->
        <div class="mb-3">
            <h5>Filter Events</h5>
            <div class="d-flex gap-3">
                <div>
                    <input type="radio" name="filter" id="filterCategory">
                    <label for="filterCategory">By Category</label>
                </div>
                <div>
                    <input type="radio" name="filter" id="filterDate">
                    <label for="filterDate">By Date</label>
                </div>
            </div>
        </div>

        <!-- UPCOMING EVENTS LIST -->
        <h3 class="mt-4">Upcoming Events</h3>
        <div id="eventsList" class="row g-3">

            <!-- EVENT CARD -->
            <div class="col-md-4">
                <div class="card p-3">
                    <h5>Event Name</h5>
                    <p>Date: TBD</p>
                    <p>Location: TBD</p>
                    <button class="btn btn-primary rsvpBtn">RSVP</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- JavaScript -->
    <script src="js/script.js"></script>

</body>
</html>
